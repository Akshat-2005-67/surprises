<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#eef2ff,#fff1f2);display:grid;place-items:center;height:100vh;overflow:hidden}
.card{background:#fff;padding:30px;border-radius:25px;max-width:520px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.15)}
button{padding:14px 28px;border:none;border-radius:999px;font-size:18px;font-weight:700;position:absolute}
#area{position:relative;height:140px}
#yes{left:18%;top:40px;background:#6366f1;color:#fff}
#no{left:60%;top:40px}
.hidden{display:none}
</style></head><body>
<div id="q" class="card">
<h1>Main achha hu na? 😌</h1>
<p>Soch samajh ke jawab dena 😂</p>
<div id="area">
<button id="yes">YES 😌</button>
<button id="no">NO 😏</button>
</div>
</div>

<div id="a" class="card hidden">
<div style="font-size:70px">💐🤍🌸</div>
<h1>Isliye aap genius ho 😌😂</h1>
<p>Mujhe pehle se pata tha aapka answer sahi hi hoga. 😎✨</p>
</div>

<script>
const no=document.getElementById('no'),area=document.getElementById('area');
function move(){no.style.left=Math.random()*(area.clientWidth-no.offsetWidth)+'px';no.style.top=Math.random()*(area.clientHeight-no.offsetHeight)+'px';}
no.onmouseenter=move;
no.ontouchstart=e=>{e.preventDefault();move();}
yes.onclick=e=>{e.preventDefault();q.classList.add('hidden');a.classList.remove('hidden');}
yes.ontouchend=e=>{e.preventDefault();q.classList.add('hidden');a.classList.remove('hidden');}
</script></body></html>
